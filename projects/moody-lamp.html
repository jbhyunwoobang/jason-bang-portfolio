<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171816"><title>Moody Lamp — Jason Bang</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>

</head><body><header class="wrap"><nav class="nav"><a href="../index.html#work">← JASON BANG / PROJECTS</a><a href="../index.html">HOME</a></nav></header><main class="wrap"><p class="eyebrow">Product design · Prototype</p><h1>Moody Lamp</h1><p class="description">A portable bedside lamp that responds to distance and room temperature, shifting between cool blue and warm orange light.</p><img class="cover" src="../assets/moody-lamp.jpg" alt="Moody Lamp concept board and prototype photographs"></main><div class="cursor-dot" aria-hidden="true"></div>
<script>const cursorDot=document.querySelector('.cursor-dot');if(cursorDot&&matchMedia('(hover:hover) and (pointer:fine)').matches){document.documentElement.classList.add('has-dot-cursor');let cursorFrame=0,cursorX=0,cursorY=0;addEventListener('pointermove',e=>{cursorX=e.clientX;cursorY=e.clientY;if(cursorFrame)return;cursorFrame=requestAnimationFrame(()=>{cursorFrame=0;cursorDot.style.left=cursorX+'px';cursorDot.style.top=cursorY+'px';cursorDot.classList.add('is-visible')})},{passive:true});addEventListener('pointerleave',()=>cursorDot.classList.remove('is-visible'))}</script>
